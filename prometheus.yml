global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: grafana
    # Grafana serves HTTPS; comment out these four lines if you switch it to HTTP.
    # server_name must be the hostname in Grafana's certificate.
    scheme: https
    tls_config:
      ca_file: /etc/prometheus/ca.crt
      server_name: grafana.lan
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: blackbox_exporter
    static_configs:
      - targets: ["blackbox:9115"]

  # Each probe job sends its targets to the exporter as ?target=...
  # The targets below are examples: replace them with your own sites and devices.

  # Websites: up or down, response time, and certificate expiry for https://
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://example.com
          - https://prometheus.io
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

  # Ping: your router and other devices
  - job_name: blackbox_icmp
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["192.168.1.1", "1.1.1.1"]
    relabel_configs: *blackbox_relabel

  # TCP port open: host:port, e.g. SSH, or a Proxmox web UI on 8006
  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["192.168.1.10:22"]
    relabel_configs: *blackbox_relabel
